name: resonant
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resonant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: resonant
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./db/schema.sql:/schema.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonant"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET; mc anonymous set none local/$$S3_BUCKET"
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: .env
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]
    deploy: { resources: { limits: { cpus: "1", memory: 1g } } }
  worker:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    env_file: .env
    depends_on: [postgres, redis, minio]
    command: celery -A worker.celery_app worker --loglevel=INFO --concurrency=1 --max-tasks-per-child=50
    volumes: [hfcache:/root/.cache/huggingface]
    deploy: { resources: { limits: { cpus: "2", memory: 4g } } }
  beat:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    env_file: .env
    depends_on: [redis, postgres]
    command: celery -A worker.celery_app beat --loglevel=INFO
volumes: { pgdata: {}, miniodata: {}, hfcache: {} }
